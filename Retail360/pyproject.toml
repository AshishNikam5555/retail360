[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail360"
version = "1.0.0"
description = "Retail360 - Enterprise Retail Data Intelligence Platform (fictional portfolio project)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
spark = ["pyspark==3.5.3", "delta-spark==3.2.1"]
generator = ["faker>=24.0", "numpy>=1.26", "pandas>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "chispa>=0.10", "ruff>=0.5", "sqlfluff>=3.0", "yamllint>=1.35"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "spark_integration: needs real local Spark + Delta (Linux/macOS/WSL/container or proper Hadoop on Windows); skipped unless RETAIL360_RUN_SPARK_TESTS=1",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
